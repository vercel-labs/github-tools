name: eve canary

# eve ships multiple releases a week, and the durable-callback contract has
# changed shape before (0.44 stamping, 0.50 capability format). The AST guard in
# packages/github-tools-eve-extension/test/ only checks the authored source;
# this job builds and tests against eve@latest on a schedule so upstream drift
# fails here before it reaches consumers.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  canary:
    name: Build & test against eve@latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up pnpm and Node
        uses: ./.github/actions/setup
        with:
          install: 'false'

      # minimumReleaseAge is zeroed at the project-config level, not per command:
      # the canary must see the actual latest eve and its freshest transitive deps,
      # and pnpm re-verifies the lockfile on every invocation (including the implicit
      # install that `pnpm exec` triggers), so a per-command flag is not enough.
      - name: Zero minimumReleaseAge for the canary
        run: |
          perl -pi -e 's/^minimumReleaseAge: \d+$/minimumReleaseAge: 0/' pnpm-workspace.yaml
          grep -q '^minimumReleaseAge: 0$' pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump eve and AI SDK to a coherent latest pair
        run: |
          AI_VERSION="$(npm view ai version)"
          export AI_VERSION
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'pnpm-workspace.yaml'
          const source = fs.readFileSync(path, 'utf8')
          const updated = source.replace(
            /('@ai-sdk\/workflow>ai': )\S+/,
            (_, prefix) => `${prefix}${process.env.AI_VERSION}`,
          )
          if (updated === source) throw new Error('AI SDK workflow override was not updated')
          fs.writeFileSync(path, updated)
          NODE
          pnpm -r up \
            'eve@latest' \
            "ai@$AI_VERSION" \
            '@ai-sdk/gateway@latest' \
            '@ai-sdk/vue@latest' \
            '@ai-sdk/provider@latest' \
            '@ai-sdk/provider-utils@latest'
          pnpm ls -r --depth -1 eve ai || true

      - name: Build
        run: pnpm exec turbo run build --filter=@github-tools/eve

      - name: Verify durable schema transform
        run: node scripts/verify-eve-schema-transform.mjs examples/eve/.output/server/index.mjs

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=@github-tools/sdk --filter=@github-tools/eve-extension

      - name: Test
        run: pnpm exec turbo run test --filter=@github-tools/sdk --filter=@github-tools/eve-extension
