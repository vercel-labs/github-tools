name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC) + remote cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # changesets/action pushes the release branch, so credentials stay
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      # changesets/action pushes through the GitHub API and skips git user setup. Without an
      # identity, changeset's annotated `git tag -m` fails silently (it still logs
      # "New tag") and tags only land on the remote via the API createRef path.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create Release PR or Publish
        id: changesets
        # v2 is required by @changesets/cli v3: v1 parses the v2 CLI's stdout to detect
        # published packages, so with CLI v3 `published` stays false.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          # Releases are created here, then their bodies are rewritten below.
          create-github-releases: true

      # create-github-releases gives us one release per package, tagged pkg@version — that part
      # we keep. Its *body* is the CHANGELOG section, which for a dependent package is a wall of
      # "Updated dependencies [<hash>, <hash>, …]" and is empty for packages with no changeset
      # of their own. `--generate-notes` is not the answer either: GitHub builds those from a
      # commit range, and monorepo tags interleave, so each package would list everybody's PRs.
      # So we rewrite each body from the PRs that actually touched that package's directory,
      # grouped by the same categories as .github/release.yml.
      - name: Push tags
        if: steps.changesets.outputs.published == 'true'
        run: |
          # Pull API-created tags in case local annotated tagging still failed, then
          # push any local tags the publish step did create.
          git fetch origin --tags --force
          git push --tags

      - name: Rewrite release notes
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/release-notes.mjs '${{ steps.changesets.outputs.published-packages }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HEAD is always the release commit here; avoids depending on a local tag.
          RELEASE_NOTES_REF: HEAD
