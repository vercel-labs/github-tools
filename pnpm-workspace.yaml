packages:
  - 'apps/*'
  - 'examples/*'
  - 'packages/*'
  - 'tests/*'

shamefullyHoist: true

allowBuilds:
  '@mongodb-js/zstd': false
  '@nestjs/core': false
  '@parcel/watcher': false
  '@swc/core': false
  better-sqlite3: true
  cbor-extract: false
  esbuild: false
  maplibre-gl: false
  node-liblzma: false
  sharp: false
  unrs-resolver: false
  vue-demi: false

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  # Nuxt
  - '@nuxt/*'
  - '@nuxtjs/*'
  - 'nuxt'
  - 'nuxt-*'
  - 'docus'
  # Vercel
  - '@vercel/*'
  - '@ai-sdk/*'
  - 'ai'
  - 'eve'
  - 'create-eve'
  - 'workflow'
  - '@workflow/*'
  # HugoRCD
  - 'evlog'

overrides:
  '@ai-sdk/workflow>ai': 7.0.148
  # just-bash's guarded-fetch pins undici 7.29.0, which has high-severity advisories fixed in 7.30.1.
  'guarded-fetch>undici': 7.30.1
  'undici@5': 6.28.0
  # Nuxt 4.6 uses unhead 3.4.3, and modules resolved earlier keep 3.4.0. Nitro's file tracing then ships
  # an incomplete unhead, and the built server fails to import unhead/server.
  'unhead': 3.4.3
  '@unhead/vue': 3.4.3
  '@unhead/bundler': 3.4.3
  # Nuxt UI's editor needs every tiptap package on one version. Without this, extensions resolve
  # newer than @tiptap/core and Vite's dependency optimizer fails on the missing exports.
  '@tiptap/core': 3.33.0
  '@tiptap/pm': 3.33.0
  '@tiptap/vue-3': 3.33.0
  '@tiptap/starter-kit': 3.33.0
  '@tiptap/markdown': 3.33.0
  '@tiptap/suggestion': 3.33.0
  '@tiptap/extensions': 3.33.0
  '@tiptap/extension-list': 3.33.0
  '@tiptap/extension-bubble-menu': 3.33.0
  '@tiptap/extension-code': 3.33.0
  '@tiptap/extension-collaboration': 3.33.0
  '@tiptap/extension-drag-handle': 3.33.0
  '@tiptap/extension-drag-handle-vue-3': 3.33.0
  '@tiptap/extension-floating-menu': 3.33.0
  '@tiptap/extension-horizontal-rule': 3.33.0
  '@tiptap/extension-image': 3.33.0
  '@tiptap/extension-mention': 3.33.0
  '@tiptap/extension-node-range': 3.33.0
  '@tiptap/extension-placeholder': 3.33.0

