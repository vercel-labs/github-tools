packages:
  - 'apps/*'
  - 'examples/*'
  - 'packages/*'
  - 'tests/*'

shamefullyHoist: true

allowBuilds:
  '@mongodb-js/zstd': false
  '@nestjs/core': false
  '@parcel/watcher': false
  '@swc/core': false
  better-sqlite3: true
  cbor-extract: false
  esbuild: false
  maplibre-gl: false
  node-liblzma: false
  sharp: false
  unrs-resolver: false
  vue-demi: false

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  # Nuxt
  - '@nuxt/*'
  - '@nuxtjs/*'
  - 'nuxt'
  - 'nuxt-*'
  - 'docus'
  # Vercel
  - '@vercel/*'
  - '@ai-sdk/*'
  - 'ai'
  - 'eve'
  - 'create-eve'
  - 'workflow'
  - '@workflow/*'
  # HugoRCD
  - 'evlog'

overrides:
  '@ai-sdk/workflow>ai': 7.0.148
  # just-bash's guarded-fetch pins undici 7.29.0, which has high-severity advisories fixed in 7.30.1.
  'guarded-fetch>undici': 7.30.1
  'undici@5': 6.28.0

